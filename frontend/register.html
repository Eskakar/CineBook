<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar — CineBook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex flex-col">

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-white font-bold text-xl tracking-tight">
        🎬 <span class="text-red-500">Cine</span>Book
      </a>
      <div id="navAuth" class="flex items-center gap-4"></div>
    </div>
  </nav>

  <!-- ===== FORM REGISTER ===== -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">

      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-white">Buat Akun CineBook</h1>
        <p class="text-slate-400 text-sm mt-1">Daftar gratis, pesan tiket kapan saja</p>
      </div>

      <div class="bg-[#1a1a2e] border border-white/10 rounded-2xl p-6 shadow-xl">
        <form id="registerForm" novalidate class="space-y-4">

          <div>
            <label class="text-slate-400 text-xs uppercase tracking-wide block mb-1">Nama Lengkap</label>
            <input id="nameInput" type="text" placeholder="Nama kamu"
              class="input-dark" autocomplete="name" required />
          </div>

          <div>
            <label class="text-slate-400 text-xs uppercase tracking-wide block mb-1">Email</label>
            <input id="emailInput" type="email" placeholder="email@contoh.com"
              class="input-dark" autocomplete="email" required />
          </div>

          <div>
            <label class="text-slate-400 text-xs uppercase tracking-wide block mb-1">Password</label>
            <div class="relative">
              <input id="passwordInput" type="password" placeholder="Min. 6 karakter"
                class="input-dark pr-10" autocomplete="new-password" required />
              <button type="button" id="togglePassword"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-sm transition"
                aria-label="Tampilkan/sembunyikan password">👁</button>
            </div>
          </div>

          <!-- Error message -->
          <p id="registerError" class="text-red-400 text-xs hidden"></p>

          <button type="submit" id="submitBtn" class="btn-primary w-full mt-2">
            Buat Akun
          </button>
        </form>

        <p class="text-center text-slate-500 text-sm mt-4">
          Sudah punya akun?
          <a href="login.html" class="text-red-400 hover:text-red-300 font-medium transition">Masuk di sini</a>
        </p>
      </div>
    </div>
  </main>

  <!-- ===== TOAST ===== -->
  <div id="toast"></div>

  <script src="script/auth.js"></script>
  <script src="script/register.js"></script>
</body>
</html>
